{% extends "admin/base.html" %}
{% block title %}Nova impressora{% endblock %}
{% block page_title %}Nova impressora{% endblock %}

{% block content %}
<div class="form-page">
    <div class="card">
        <div class="card__body">
            <form method="POST" class="form-grid">
                <div class="form-field">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" required>
                </div>
                <div class="form-field">
                    <label for="ip">Endereço IP</label>
                    <input type="text" name="ip" id="ip" placeholder="192.168.0.10" required>
                </div>
                <div class="form-field">
                    <label for="porta">Porta</label>
                    <input type="number" name="porta" id="porta" value="9100" required>
                </div>
                <div class="form-field">
                    <label for="setor_id">Setor</label>
                    <select name="setor_id" id="setor_id" required>
                        <option value="" disabled selected>Selecione o setor</option>
                        {% for setor in setores %}
                        <option value="{{ setor.id }}">{{ setor.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <a href="{{ url_for('admin.admin') }}#impressoras" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
