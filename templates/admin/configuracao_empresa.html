{% extends "admin/base.html" %}
{% block title %}Configuração da empresa{% endblock %}
{% block page_title %}Configuração da empresa{% endblock %}

{% block content %}
<div class="form-page">
    <div class="card">
        <div class="card__body">
            <p style="background:var(--primary-50);color:var(--primary-700);padding:12px 16px;border-radius:var(--radius-sm);font-size:0.88em;margin-top:0;">
                O nome da empresa será exibido em todas as impressões de senhas.
            </p>
            <form method="POST" class="form-grid">
                <div class="form-field">
                    <label for="nome_empresa">Nome da empresa</label>
                    <input type="text" id="nome_empresa" name="nome_empresa" value="{{ nome_empresa }}" placeholder="Digite o nome da sua empresa" required>
                </div>
                <div class="form-actions">
                    <a href="{{ url_for('admin.admin') }}#configuracoes" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar configuração</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
